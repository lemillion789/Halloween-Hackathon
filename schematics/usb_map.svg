roke="#8d6e00" stroke-width="2.5"/><text x="1110.0" y="616" font-size="15" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Libre</text><text x="1110.0" y="636" font-size="12" text-anchor="middle" fill="#666" font-family="Helvetica,Arial,sans-serif">repuesto</text><text x="60" y="640" font-size="12" text-anchor="start" fill="#666" font-family="Helvetica,Arial,sans-serif">Nombres estables de los ESP32: usar /dev/serial/by-path/... (mismo chip en ambos) y conectar siempre cada uno al mismo puerto.</text></svg>