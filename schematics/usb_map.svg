<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" width="1300" height="700"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" font-size="22" text-anchor="start" fill="#222" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Mapa USB de la Jetson Orin Nano</text><text x="20" y="58" font-size="13" text-anchor="start" fill="#666" font-family="Helvetica,Arial,sans-serif">Bluetooth: ya integrado en la Jetson (bluetoothctl lo lista), no hace falta dongle.</text><rect x="60" y="100" width="280" height="470" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="200.0" y="124" font-size="15" text-anchor="middle" fill="#222" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Jetson Orin Nano</text><text x="200.0" y="144" font-size="12" text-anchor="middle" fill="#666" font-family="Helvetica,Arial,sans-serif">carrier board</text><rect x="300" y="176" width="40" height="28" fill="#cfd8dc" stroke="#222" stroke-width="2"/><text x="290" y="195" font-size="12" text-anchor="end" fill="#222" font-family="Helvetica,Arial,sans-serif">USB-A 1 (USB 3)</text><rect x="300" y="246" width="40" height="28" fill="#cfd8dc" stroke="#222" stroke-width="2"/><text x="290" y="265" font-size="12" text-anchor="end" fill="#222" font-family="Helvetica,Arial,sans-serif">USB-A 2</text><rect x="300" y="316" width="40" height="28" fill="#cfd8dc" stroke="#222" stroke-width="2"/><text x="290" y="335" font-size="12" text-anchor="end" fill="#222" font-family="Helvetica,Arial,sans-serif">USB-A 3</text><rect x="300" y="386" width="40" height="28" fill="#cfd8dc" stroke="#222" stroke-width="2"/><text x="290" y="405" font-size="12" text-anchor="end" fill="#222" font-family="Helvetica,Arial,sans-serif">USB-A 4</text><rect x="300" y="486" width="40" height="28" fill="#cfd8dc" stroke="#222" stroke-width="2"/><text x="290" y="505" font-size="12" text-anchor="end" fill="#222" font-family="Helvetica,Arial,sans-serif">USB-C (a verificar: host)</text><polyline poi